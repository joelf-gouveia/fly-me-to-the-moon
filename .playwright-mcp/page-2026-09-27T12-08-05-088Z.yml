    - generic [ref=f15e324]:
      - generic [ref=f15e325]:
        - paragraph [ref=f15e326]: WHAT THE STUDY SHOWS
        - heading "Five reasons she looks loose." [level=2] [ref=f15e327]
      - article [ref=f15e328]:
        - text: 01 / SHOULDERS
        - heading "The arms start outside the body" [level=3] [ref=f15e329]
        - paragraph [ref=f15e330]: The shoulder points are 0.23 from the middle. The torso is only 0.16 wide at that height, so the flat end of each arm stands in the air. A ball or a sleeve closes the gap.
      - article [ref=f15e331]:
        - text: 02 / FLAT ENDS
        - heading "Cylinders open at a bend" [level=3] [ref=f15e332]
        - paragraph [ref=f15e333]: Two cut cylinders meet at one point. When the joint bends, a wedge opens on the outer side. Capsules with the same radius at the joint have no seam at any angle.
      - article [ref=f15e334]:
        - text: 03 / BONES
        - heading "The limbs stretch" [level=3] [ref=f15e335]
        - paragraph [ref=f15e336]: The pose moves the joints, not the bones. A forearm can grow by more than half of its length between cruise and boost. A two-bone solve keeps each bone at one length and reaches the same hands and feet.
      - article [ref=f15e337]:
        - text: 04 / WINGS
        - heading "The wings float behind her" [level=3] [ref=f15e338]
        - paragraph [ref=f15e339]: The wing roots are almost 0.1 behind the back. A petal bow between the roots holds the wings, and it gives the rear camera a clear centre.
      - article [ref=f15e340]:
        - text: 05 / FAIRY
        - heading "She looks at the ground" [level=3] [ref=f15e341]
        - paragraph [ref=f15e342]: "The head leans with the body: 32° down in cruise, 66° in boost. A head that lifts to look ahead, soft wrists, pointed toes and petals that move with the wings make her feel light."
    - generic [ref=f15e343]:
      - generic [ref=f15e344]:
        - paragraph [ref=f15e345]: THE RECOMMENDATION
        - heading "C · Storybook fairy, in two steps." [level=2] [ref=f15e346]
        - paragraph [ref=f15e347]: "First bring the joined body of B into the game: it closes every joint and fixes the bones. Then add the proportions and the moving joints of C. The head, the hair, the wings and the customization stay the same."
        - paragraph [ref=f15e348]:
          - strong [ref=f15e349]: "Your pick: C · Storybook fairy."
          - text: This is the recommendation.
