    - generic [ref=f1e522]:
      - generic [ref=f1e523]:
        - paragraph [ref=f1e524]: WHAT THE STUDY SHOWS
        - heading "Four rules for new hair." [level=2] [ref=f1e525]
      - article [ref=f1e526]:
        - text: 01 / THE BACK OF THE HEAD
        - heading "Design for the rear camera" [level=3] [ref=f1e527]
        - paragraph [ref=f1e528]: In flight, the camera is behind her and 19° above. A style that only changes the face or the top of the cap is hard to see. Pixie and Crown braid add the least outside the cap.
      - article [ref=f1e529]:
        - text: 02 / MOTION
        - heading "Let long hair move" [level=3] [ref=f1e530]
        - paragraph [ref=f1e531]: From behind, a ponytail covers the cap and adds little new shape. Its swing and its stream in boost make it clear. Motion also makes boost easier to feel.
      - article [ref=f1e532]:
        - text: 03 / THE WING LINE
        - heading "Stay inside x = ±0.19 below the ears" [level=3] [ref=f1e533]
        - paragraph [ref=f1e534]: Each wing starts at x = ±0.19 and only goes out from there. Hair inside that line cannot touch a wing. Tails and Bob cross it; they keep their first shape.
      - article [ref=f1e535]:
        - text: 04 / THE EARS
        - heading "Keep the pointed ears clear" [level=3] [ref=f1e536]
        - paragraph [ref=f1e537]: The pointed ears tell the player that she is a fairy. The test checks that the outer half of each ear stays outside every part of the hair.
    - generic [ref=f1e538]:
