        - heading "Space buns, Cloud curls, Ponytail, Long braid, Twin braids and Long waves." [level=2] [ref=f1e541]
        - paragraph [ref=f1e542]: The game has nine hair styles in three rows, with the gentle hair motion. Pixie and Crown braid stay in the study.
        - paragraph [ref=f1e543]:
