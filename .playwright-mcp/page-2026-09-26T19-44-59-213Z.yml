    - generic [ref=e516]:
      - generic [ref=e517]:
        - paragraph [ref=e518]: WHAT THE STUDY SHOWS
        - heading "Four rules for new hair." [level=2] [ref=e519]
      - article [ref=e520]:
        - text: 01 / THE BACK OF THE HEAD
        - heading "Design for the rear camera" [level=3] [ref=e521]
        - paragraph [ref=e522]: In flight, the camera is behind her and 19° above. A style that only changes the face or the top of the cap is hard to see. Pixie and Crown braid add the least outside the cap.
      - article [ref=e523]:
        - text: 02 / MOTION
        - heading "Let long hair move" [level=3] [ref=e524]
        - paragraph [ref=e525]: From behind, a ponytail covers the cap and adds little new shape. Its swing and its stream in boost make it clear. Motion also makes boost easier to feel.
      - article [ref=e526]:
        - text: 03 / THE WING LINE
        - heading "Stay inside x = ±0.19 below the ears" [level=3] [ref=e527]
        - paragraph [ref=e528]: Each wing starts at x = ±0.19 and only goes out from there. Hair inside that line cannot touch a wing. Tails and Bob in the game today cross it.
      - article [ref=e529]:
        - text: 04 / THE EARS
        - heading "Keep the pointed ears clear" [level=3] [ref=e530]
        - paragraph [ref=e531]: The pointed ears tell the player that she is a fairy. The test checks that each ear tip stays outside every part of the hair.
    - generic [ref=e532]:
